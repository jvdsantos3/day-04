[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-assistant"
version = "0.1.0"
description = "Assistente Financeiro multi-agente (FastAPI + LangGraph + ChromaDB)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "pydantic-settings",
    "bcrypt",
    "python-jose",
    "langchain",
    "langgraph",
    "langchain-openai",
    "chromadb",
    "langchain-huggingface",
    "sentence-transformers",
    "langchain-mcp-adapters",
    "jinja2",
    "python-multipart",
    "httpx",
    "langgraph-checkpoint-sqlite>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]
